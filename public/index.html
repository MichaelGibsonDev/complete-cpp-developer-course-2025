<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ Runner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --error: #f85149;
      --warning: #d29922;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header h1 .logo { color: var(--accent); font-size: 20px; }
    .search-box {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-box input {
      width: 100%;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .program-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .section-group { margin-bottom: 2px; }
    .section-header {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-header:hover { color: var(--text); }
    .section-header .chevron {
      font-size: 10px;
      transition: transform 0.15s;
      width: 12px;
    }
    .section-group.collapsed .chevron { transform: rotate(-90deg); }
    .section-group.collapsed .section-programs { display: none; }
    .section-programs { padding: 2px 0; }
    .program-item {
      padding: 5px 16px 5px 34px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.1s;
    }
    .program-item:hover { background: var(--bg-tertiary); }
    .program-item.active {
      background: rgba(88, 166, 255, 0.12);
      border-left-color: var(--accent);
      color: var(--accent);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .main-header {
      padding: 10px 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 16px;
    }
    .program-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .program-title .path-sep { color: var(--text-muted); margin: 0 4px; }
    .run-btn {
      padding: 6px 20px;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .run-btn:hover:not(:disabled) { background: #46c75a; }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .run-btn.running { background: var(--warning); }

    /* File tabs */
    .file-tabs {
      display: flex;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .file-tab {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    .file-tab:hover { color: var(--text); }
    .file-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      background: var(--bg);
    }

    /* Source viewer */
    .source-viewer {
      flex: 1;
      overflow: auto;
      background: var(--bg);
      padding: 0;
      min-height: 0;
    }
    .source-viewer pre {
      margin: 0;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .source-viewer pre code { background: none !important; padding: 0 !important; }
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: var(--text-muted);
    }
    .welcome .icon { font-size: 48px; margin-bottom: 16px; }
    .welcome h2 { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 14px; max-width: 400px; line-height: 1.5; }

    /* Bottom panel */
    .bottom-panel {
      height: 240px;
      flex-shrink: 0;
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .panel-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-section + .panel-section { border-left: 1px solid var(--border); }
    .panel-header {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .clear-btn:hover { color: var(--text); border-color: var(--text-muted); }
    #stdinInput {
      flex: 1;
      padding: 10px 14px;
      background: var(--bg);
      border: none;
      color: var(--text);
      font-size: 13px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    #stdinInput::placeholder { color: #484f58; }
    .output-display {
      flex: 1;
      padding: 10px 14px;
      overflow: auto;
      font-size: 13px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-placeholder { color: #484f58; font-style: italic; }
    .output-running { color: var(--warning); }
    .output-stdout { color: var(--text); }
    .output-stderr { color: var(--error); }
    .output-error { color: var(--error); }
    .output-exit { color: var(--text-muted); display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .output-muted { color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><span class="logo">⚡</span> C++ Runner</h1>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search programs..." />
    </div>
    <div class="program-list" id="programList">
      <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px;">Loading...</div>
    </div>
  </aside>

  <main class="main">
    <header class="main-header">
      <div class="program-title" id="programTitle">Select a program</div>
      <button class="run-btn" id="runBtn" disabled>Run ▶</button>
    </header>
    <div class="file-tabs" id="fileTabs"></div>
    <div class="source-viewer" id="sourceViewer">
      <div class="welcome">
        <div class="icon">⚡</div>
        <h2>C++ Course Runner</h2>
        <p>Select a program from the sidebar to view its source code, provide input, and run it right in your browser.</p>
      </div>
    </div>
    <div class="bottom-panel">
      <div class="panel-section">
        <div class="panel-header">Standard Input</div>
        <textarea id="stdinInput" placeholder="Enter input for the program (stdin)..." spellcheck="false"></textarea>
      </div>
      <div class="panel-section">
        <div class="panel-header">
          Output
          <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
        <div class="output-display" id="outputDisplay">
          <span class="output-placeholder">Output will appear here after running...</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    let sections = [];
    let selectedProgram = null;
    let currentFiles = [];
    let activeFileIndex = 0;

    const $ = (id) => document.getElementById(id);

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function formatSectionName(name) {
      return name.replace('section_', 'Section ').replace(/_/g, ' ');
    }

    function formatProgramName(name) {
      return name.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ').trim();
    }

    async function loadPrograms() {
      try {
        const res = await fetch('/api/programs');
        const data = await res.json();
        sections = data.sections;
        renderSidebar();
      } catch (err) {
        $('programList').innerHTML = '<div style="padding:20px;color:var(--error);font-size:13px;">Failed to load programs</div>';
      }
    }

    function renderSidebar() {
      const filter = $('searchInput').value.toLowerCase();
      let html = '';
      for (const section of sections) {
        const programs = section.programs.filter(
          (p) => !filter || p.name.toLowerCase().includes(filter) || p.section.toLowerCase().includes(filter)
        );
        if (programs.length === 0) continue;
        const collapsed = filter ? '' : '';
        html += `<div class="section-group${collapsed}">`;
        html += `<div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">`;
        html += `<span class="chevron">▼</span> ${escapeHtml(formatSectionName(section.name))}`;
        html += `<span style="margin-left:auto;color:var(--text-muted);font-size:10px;">${programs.length}</span>`;
        html += `</div><div class="section-programs">`;
        for (const p of programs) {
          const active = selectedProgram && selectedProgram.id === p.id ? ' active' : '';
          html += `<div class="program-item${active}" data-id="${escapeHtml(p.id)}">${escapeHtml(formatProgramName(p.name))}</div>`;
        }
        html += `</div></div>`;
      }
      $('programList').innerHTML = html || '<div style="padding:20px;color:var(--text-muted);font-size:13px;">No programs found</div>';
      document.querySelectorAll('.program-item').forEach((el) => {
        el.addEventListener('click', () => selectProgram(el.dataset.id));
      });
    }

    async function selectProgram(programId) {
      const program = sections.flatMap((s) => s.programs).find((p) => p.id === programId);
      if (!program) return;
      selectedProgram = program;

      // Update title
      const parts = program.id.split('/');
      $('programTitle').innerHTML = parts
        .map((p, i) => i < parts.length - 1 ? `${escapeHtml(formatProgramName(p) || p)}<span class="path-sep">/</span>` : escapeHtml(formatProgramName(p)))
        .join('');

      $('runBtn').disabled = false;
      renderSidebar();

      // Load source
      try {
        const res = await fetch(`/api/source?path=${encodeURIComponent(program.id)}`);
        const data = await res.json();
        currentFiles = data.files;
        activeFileIndex = 0;
        renderFileTabs();
        renderSource();
      } catch {
        $('sourceViewer').innerHTML = '<div class="welcome"><p>Failed to load source code.</p></div>';
      }
    }

    function renderFileTabs() {
      if (currentFiles.length <= 1) {
        $('fileTabs').innerHTML = '';
        return;
      }
      let html = '';
      currentFiles.forEach((f, i) => {
        html += `<div class="file-tab${i === activeFileIndex ? ' active' : ''}" data-index="${i}">${escapeHtml(f.name)}</div>`;
      });
      $('fileTabs').innerHTML = html;
      document.querySelectorAll('.file-tab').forEach((el) => {
        el.addEventListener('click', () => {
          activeFileIndex = parseInt(el.dataset.index);
          renderFileTabs();
          renderSource();
        });
      });
    }

    function renderSource() {
      if (currentFiles.length === 0) return;
      const file = currentFiles[activeFileIndex];
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.className = 'language-cpp';
      code.textContent = file.content;
      pre.appendChild(code);
      $('sourceViewer').innerHTML = '';
      $('sourceViewer').appendChild(pre);
      if (window.hljs) {
        try { hljs.highlightElement(code); } catch {}
      }
    }

    async function runProgram() {
      if (!selectedProgram) return;
      const runBtn = $('runBtn');
      const outputDisplay = $('outputDisplay');
      runBtn.disabled = true;
      runBtn.textContent = 'Running...';
      runBtn.classList.add('running');
      outputDisplay.innerHTML = '<span class="output-running">⏳ Compiling and running...</span>';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: selectedProgram.id,
            input: $('stdinInput').value,
          }),
        });
        const result = await res.json();
        let html = '';
        if (result.compileError) {
          html = `<span class="output-error">❌ Compilation Error:\n\n${escapeHtml(result.compileError)}</span>`;
        } else {
          if (result.stdout) html += `<span class="output-stdout">${escapeHtml(result.stdout)}</span>`;
          if (result.stderr) html += `<span class="output-stderr">${escapeHtml(result.stderr)}</span>`;
          if (!result.stdout && !result.stderr) html += '<span class="output-muted">(no output)</span>';
          const exitLabel = result.exitCode === 0
            ? `<span style="color:var(--success)">✓ Process exited with code ${result.exitCode}</span>`
            : `<span style="color:var(--error)">✗ Process exited with code ${result.exitCode}</span>`;
          html += `<span class="output-exit">${exitLabel}</span>`;
        }
        outputDisplay.innerHTML = html;
      } catch (err) {
        outputDisplay.innerHTML = `<span class="output-error">Error: ${escapeHtml(err.message)}</span>`;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = 'Run ▶';
        runBtn.classList.remove('running');
      }
    }

    // Event listeners
    $('runBtn').addEventListener('click', runProgram);
    $('clearBtn').addEventListener('click', () => {
      $('outputDisplay').innerHTML = '<span class="output-placeholder">Output will appear here after running...</span>';
    });
    $('searchInput').addEventListener('input', renderSidebar);
    $('stdinInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runProgram();
      }
    });

    // Init
    loadPrograms();
  </script>
</body>
</html>
