services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    volumes:
      - .:/app
      - /app/server/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "cd /app/server && npm install && exec node --watch index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
